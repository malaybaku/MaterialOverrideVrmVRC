name: Build Draft Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: python scripts~/build_package.py
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          gh release create "$version" dist~/*.zip --draft --target "$GITHUB_SHA" --title "$version — Open Beta" --notes "Open beta. Review CHANGELOG.md and complete the clean-project installation checks before publishing."
